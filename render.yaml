services:
  - type: web
    name: genshin-irminsul-lore
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app_visor:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NEO4J_URI
        value: neo4j+s://90f31cb2.databases.neo4j.io
      - key: NEO4J_USER
        value: 90f31cb2
      - key: NEO4J_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
